<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE STAMP PALETTE. Not a feature and never drawn in the game: files here whose name begins with "_" are skipped by tools/gen_overworld_art.js. This is a sheet of
  glyphs to copy from, so a forest or a range is stamped rather than drawn freehand.

  HOW TO USE IT
    1. Open this file and the feature you are drawing (say longshade.svg) side by side in Inkscape.
    2. Click a glyph here, Ctrl+C, then Ctrl+V into the feature's "art" layer and drag it where it goes. Scale with the corner handles; mirror with H to stop a row
       of trees looking stamped. A glyph keeps its own transform, and translate / scale / matrix are all understood by the tool, so nothing needs flattening.
    3. BEFORE running the tool: Ctrl+Shift+G (ungroup) anything that came over as a group, and Shift+Ctrl+C (Path > Object to Path) anything that is not a path.
       The tool refuses a <use>, a group with a transform, or a shape that is not a path, and says which file it found it in.

  SIZES. 130 units are one map unit, the same as every file here, and a village's dot on the map is 36 units across — the circle at the end of the row, which is
  here only to judge against. So a tree is about a third of a village, and a range is three villages wide. Keep to that: a tree drawn large enough to see when the
  whole world is in view is a tree the size of a town.

  HOW TO PLACE THEM. Not in a carpet. Draw the shape of the wood or the range as ONE filled path first, and give that path class="wash" (Ctrl+Shift+X, the + button, name "class", value "wash") so it is drawn faint under the glyphs — that wash is what carries it when the map is zoomed out —
  then stamp glyphs densely along its edge and thinning inward, with the middle left as plain wash. That is how a drawn map reads, and it is thirty stamps for a
  forest rather than two hundred. For a long treeline, Extensions > Generate from Path > Pattern along Path beats clicking, as long as you Object to Path afterwards.

  COLOUR. Set in overworldmap.css by the feature's kind (.ow-f-forest, .ow-f-range and so on), never here. The fills below are only so the sheet is visible in an
  editor. A path with class="ridge" is drawn as a thin lighter line instead of a filled shape: used for the crest lines on the mountains.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="-30 -58 600 180" width="600" height="180">
  <style>
    #stamps path { fill: #6b5f4e; stroke: none; }
    #stamps path.ridge { fill: none; stroke: #cfc3ad; stroke-width: 1.2; stroke-linecap: round; }
    #stamps text { fill: #9a8f7d; font: 7px sans-serif; text-anchor: middle; }
  </style>

  <g inkscape:groupmode="layer" inkscape:label="stamps" id="stamps">

    <!-- fir: the ordinary conifer of the Longshade. 12 tall. -->
    <path transform="translate(0,0)" d="M0,-12 L2.8,-6.5 L1.4,-6.5 L3.6,-2.5 L0.9,-2.5 L0.9,0 L-0.9,0 L-0.9,-2.5 L-3.6,-2.5 L-1.4,-6.5 L-2.8,-6.5 Z"/>
    <text x="0" y="12">fir</text>

    <!-- fir, small: for thinning a treeline out toward open ground. 8 tall. -->
    <path transform="translate(24,0)" d="M0,-8 L1.9,-4.3 L0.95,-4.3 L2.4,-1.7 L0.6,-1.7 L0.6,0 L-0.6,0 L-0.6,-1.7 L-2.4,-1.7 L-0.95,-4.3 L-1.9,-4.3 Z"/>
    <text x="24" y="20">fir, small</text>

    <!-- broadleaf: older, lower woodland. 11 tall. -->
    <path transform="translate(52,0)" d="M0.8,0 L0.8,-3.4 C3.5,-3.7 4.6,-6.1 3.5,-7.9 C3.1,-10.2 0.6,-11.3 -1.1,-9.9 C-3.4,-10.3 -4.8,-7.9 -3.8,-6.0 C-4.5,-4.1 -2.5,-3.0 -0.8,-3.4 L-0.8,0 Z"/>
    <text x="52" y="12">broadleaf</text>

    <!-- broadleaf, small. 8 tall. -->
    <path transform="translate(80,0)" d="M0.6,0 L0.6,-2.5 C2.5,-2.7 3.3,-4.4 2.5,-5.7 C2.2,-7.4 0.4,-8.2 -0.8,-7.2 C-2.5,-7.5 -3.5,-5.7 -2.8,-4.4 C-3.3,-3.0 -1.8,-2.2 -0.6,-2.5 L-0.6,0 Z"/>
    <text x="80" y="20">broadleaf, small</text>

    <!-- grove: two firs and a broadleaf as ONE path, for filling ground quickly without three pastes. 10 tall, 20 wide. -->
    <path transform="translate(116,0)" d="M-7,-10 L-4.7,-5.4 L-5.8,-5.4 L-4,-2.1 L-6.2,-2.1 L-6.2,0 L-7.8,0 L-7.8,-2.1 L-10,-2.1 L-8.2,-5.4 L-9.3,-5.4 Z M7,-9 L9.1,-4.9 L8.1,-4.9 L9.7,-1.9 L7.7,-1.9 L7.7,0 L6.3,0 L6.3,-1.9 L4.3,-1.9 L5.9,-4.9 L4.9,-4.9 Z M0.7,0 L0.7,-3.0 C3.1,-3.3 4.1,-5.4 3.1,-7.0 C2.8,-9.1 0.5,-10.0 -1.0,-8.8 C-3.0,-9.1 -4.3,-7.0 -3.4,-5.3 C-4.0,-3.6 -2.2,-2.7 -0.7,-3.0 L-0.7,0 Z"/>
    <text x="116" y="12">grove</text>

    <!-- marsh tuft: wet ground, the Black Sinks and river edges. 9 tall. -->
    <path transform="translate(145,0)" d="M-6,0 L-4.4,-7 L-3.0,0 Z M-1.2,0 L0,-9 L1.2,0 Z M3.0,0 L4.4,-7 L6,0 Z"/>
    <text x="145" y="12">marsh tuft</text>

    <!-- hill: one low rise. 14 tall, 44 wide. -->
    <path transform="translate(190,0)" d="M-22,0 C-16,-13 -7,-15 0,-9.5 C7,-15 16,-13 22,0 Z"/>
    <text x="190" y="12">hill</text>

    <!-- hills, a run of them: for broken upland rather than a single rise. 13 tall, 57 wide. -->
    <path transform="translate(255,0)" d="M-26,0 C-20,-11 -12,-13 -6,-8 C0,-13 8,-11 13,0 Z M11,0 C14,-8 20,-9 24,-4.5 C26,-7 29,-6 31,0 Z"/>
    <text x="257" y="12">hills</text>

    <!-- single peak, with its crest. 32 tall. -->
    <path transform="translate(320,0)" d="M-16,0 L-5,-22 L0,-32 L6,-20 L16,0 Z"/>
    <path class="ridge" transform="translate(320,0)" d="M0,-32 L-5,-19 L-11,-6"/>
    <text x="320" y="12">peak</text>

    <!-- a block of range: the unit the Coldspine is built from. Stamp these along the crest, over the wash, overlapping and mirrored so no two read alike. 34 tall, 104 wide. -->
    <path transform="translate(415,0)" d="M-54,0 L-38,-22 L-30,-15 L-16,-34 L-3,-17 L7,-27 L19,-12 L33,-29 L50,0 Z"/>
    <path class="ridge" transform="translate(415,0)" d="M-16,-34 L-21,-21 L-28,-8 M33,-29 L29,-17 L24,-5"/>
    <text x="415" y="12">range block</text>

    <!-- NOT a stamp: a village's dot at its real size, to judge the glyphs against. Do not copy this one. -->
    <circle cx="530" cy="-18" r="18" fill="none" stroke="#9a8f7d" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="530" y="12">village dot (36 across)</text>

    <!-- WATER, second row. Drawn as solid tapered crescents, not thin strokes, for the same reason the trees are solid: a hairline disappears when the whole world is in
         view. Open water is a scatter of these, thinning away from the shore, NOT a grid. A river is not stamped at all: it is one stroked path, drawn with the pen tool. -->

    <!-- wave: the ordinary open-water mark. 14 wide. -->
    <path transform="translate(0,70)" d="M-7,0 C-4.8,-3.0 -2.2,-2.6 0,-1.0 C2.2,0.6 4.6,1.0 7,-1.4 C4.6,-0.2 2.2,-0.4 0,-2.0 C-2.2,-3.6 -4.8,-4.0 -7,0 Z"/>
    <text x="0" y="82">wave</text>

    <!-- wave, small: for thinning water out, and for close inshore. 9 wide. -->
    <path transform="translate(28,70)" d="M-4.6,0 C-3.1,-2.0 -1.4,-1.7 0,-0.7 C1.4,0.4 3.0,0.7 4.6,-0.9 C3.0,-0.1 1.4,-0.3 0,-1.3 C-1.4,-2.3 -3.1,-2.6 -4.6,0 Z"/>
    <text x="28" y="90">wave, small</text>

    <!-- wave group: three small waves staggered, as ONE path, for covering open sea quickly. 26 wide, 12 tall. -->
    <path transform="translate(72,70)" d="M-13.6,0 c1.5,-2 3.2,-1.7 4.6,-0.7 c1.4,1.1 3,1.4 4.6,-0.2 c-1.6,0.8 -3.2,0.6 -4.6,-0.4 c-1.4,-1 -3.1,-1.3 -4.6,1.3 z M-1.6,-5 c1.5,-2 3.2,-1.7 4.6,-0.7 c1.4,1.1 3,1.4 4.6,-0.2 c-1.6,0.8 -3.2,0.6 -4.6,-0.4 c-1.4,-1 -3.1,-1.3 -4.6,1.3 z M-7.6,-10 c1.5,-2 3.2,-1.7 4.6,-0.7 c1.4,1.1 3,1.4 4.6,-0.2 c-1.6,0.8 -3.2,0.6 -4.6,-0.4 c-1.4,-1 -3.1,-1.3 -4.6,1.3 z"/>
    <text x="72" y="82">wave group</text>

    <!-- swell: deep water well off the coast. Doubled rather than merely bigger, so it is a different MARK from the wave and not the same one scaled: on the map the
         single tick reads as inshore water and this as open sea. 20 wide. -->
    <path transform="translate(130,70)" d="M-10,0 C-6.9,-4.3 -3.1,-3.7 0,-1.4 C3.1,0.9 6.6,1.4 10,-2.0 C6.6,-0.3 3.1,-0.6 0,-2.9 C-3.1,-5.1 -6.9,-5.7 -10,0 Z M-7.4,4.6 C-5.2,1.6 -2.4,2.0 0,3.6 C2.4,5.2 4.8,5.4 7.4,3.0 C4.8,4.4 2.4,4.2 0,2.6 C-2.4,1.0 -5.2,0.8 -7.4,4.6 Z"/>
    <text x="130" y="90">swell</text>

    <!-- shore lines: the nested bands that follow a coast. A stamp only suits a gentle curve; for a real coastline, select the shore path and use Path > Linked Offset
         (Ctrl+Alt+J) two or three times, then Object to Path, which follows every bay instead of fighting it. 40 wide. -->
    <path transform="translate(200,70)" d="M-20,0 C-12,-6 12,-6 20,0 C12,-4.6 -12,-4.6 -20,0 Z M-15,-5 C-9,-10 9,-10 15,-5 C9,-8.8 -9,-8.8 -15,-5 Z M-10,-10 C-6,-13.6 6,-13.6 10,-10 C6,-12.6 -6,-12.6 -10,-10 Z"/>
    <text x="200" y="82">shore lines</text>

  </g>
</svg>

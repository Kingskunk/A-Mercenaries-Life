<div id="statSidebar"></div>
<script>
(function() {
  function fmt(v) { return (v === undefined || v === null) ? "" : v; }
  function renderStatSidebar() {
    var el = document.getElementById("statSidebar");
    if (!el) return;
    var s = window.stats;
    if (!s || !s.intake_completed || s.intake_completed === "false") {
      el.style.display = "none";
      return;
    }
    el.style.display = "";
    var hpHtml = fmt(s.hp_current) + " / " + fmt(s.hp_max);
    if (s.temp_hp && Number(s.temp_hp) > 0) {
      hpHtml += " (+" + fmt(s.temp_hp) + ")";
    }
    var resourceHtml = "";
    if (s.character_class === "wizard") {
      resourceHtml = "<div class=\"statRow\"><span>Spell Slots</span><span>" + fmt(s.wizard_spell_slots) + " / 2</span></div>";
    } else if (s.character_class === "warlock") {
      resourceHtml = "<div class=\"statRow\"><span>Pact Slots</span><span>" + fmt(s.warlock_spell_slots) + " / 1</span></div>";
    } else if (s.character_class === "bard") {
      resourceHtml = "<div class=\"statRow\"><span>Spell Slots</span><span>" + fmt(s.bard_spell_slots) + " / 2</span></div>";
    } else if (s.character_class === "fighter") {
      resourceHtml = "<div class=\"statRow\"><span>Second Wind</span><span>" + fmt(s.fighter_second_wind_uses) + " / 1</span></div>";
    } else if (s.character_class === "barbarian") {
      resourceHtml = "<div class=\"statRow\"><span>Rage</span><span>" + fmt(s.barbarian_rage_uses) + " / 2</span></div>";
    }

    // Every quest listed in quest-data.js whose active(stats) is true.
    var activeQuestHtml = "";
    var activeQuests = (window.QUESTLOG || []).filter(function (q) {
      try { return q.active(s); } catch (e) { return false; }
    });
    if (activeQuests.length) {
      activeQuestHtml = "<hr class=\"sectionDivider\">" + activeQuests.map(function (q) {
        return "<div class=\"statRow\"><span>" + (activeQuests.length > 1 ? "Quest" : "Active Quest") + "</span><span style=\"font-size:0.9em;\">" + q.title + "</span></div><div class=\"timePeriod\">" + q.place + "</div>";
      }).join("");
    }

    var dayDisplay = s.day_of_week ? fmt(s.day_of_week) : ("Day " + fmt(s.campaign_day || "1"));
    var dateDisplay = fmt(s.calendar_date);
    var weatherDisplay = fmt(s.weather || "Clear");

    el.innerHTML =
      "<h3>" + fmt(s.name) + " — Lv" + fmt(s.character_level) + " " + fmt(s.class_name || "Recruit") + "</h3>" +
      "<div class=\"statRow\"><span>HP</span><span>" + hpHtml + "</span></div>" +
      "<div class=\"statRow\"><span>AC</span><span>" + fmt(s.armor_class) + "</span></div>" +
      "<div class=\"statRow\"><span>Proficiency</span><span>+" + fmt(s.prof_bonus) + "</span></div>" +
      resourceHtml +
      "<div class=\"abilityGrid\">" +
        "<span>STR " + fmt(s.strength) + " (" + fmt(s.str_mod_str) + ")</span>" +
        "<span>DEX " + fmt(s.dexterity) + " (" + fmt(s.dex_mod_str) + ")</span>" +
        "<span>CON " + fmt(s.constitution) + " (" + fmt(s.con_mod_str) + ")</span>" +
        "<span>INT " + fmt(s.intelligence) + " (" + fmt(s.int_mod_str) + ")</span>" +
        "<span>WIS " + fmt(s.wisdom) + " (" + fmt(s.wis_mod_str) + ")</span>" +
        "<span>CHA " + fmt(s.charisma) + " (" + fmt(s.cha_mod_str) + ")</span>" +
      "</div>" +
      "<hr class=\"sectionDivider\">" +
      "<div class=\"statRow\"><span>Day</span><span>" + dayDisplay + "</span></div>" +
      "<div class=\"statRow\"><span>Date</span><span>" + dateDisplay + "</span></div>" +
      "<div class=\"statRow\"><span>Time</span><span>" + fmt(s.clock_time) + "</span></div>" +
      "<div class=\"timePeriod\">" + fmt(s.time_period) + "</div>" +
      "<div class=\"statRow\"><span>Weather</span><span>" + weatherDisplay + "</span></div>" +
      "<hr class=\"sectionDivider\">" +
      "<div class=\"statRow\"><span>Purse</span><span>" + fmt(s.gold) + "g " + fmt(s.silver) + "s " + fmt(s.copper) + "c</span></div>" +
      activeQuestHtml +
      (isTruthy(s.food_buff_active) || isTruthy(s.drink_buff_active) || isTruthy(s.unique_buff1_active) || isTruthy(s.unique_buff2_active) || isTruthy(s.unique_buff3_active) ?
        "<hr class=\"sectionDivider\">" +
        (isTruthy(s.food_buff_active) ?
          "<div class=\"statRow\"><span>Meal</span><span>" + fmt(s.food_buff_name) + "</span></div>" +
          "<div class=\"timePeriod\">+" + fmt(s.food_buff_bonus) + " " + fmt(s.food_buff_stat).toUpperCase() + " checks, " + fmt(s.food_buff_minutes_left) + "m left</div>"
          : "") +
        (isTruthy(s.drink_buff_active) ?
          "<div class=\"statRow\"><span>Drink</span><span>" + fmt(s.drink_buff_name) + "</span></div>" +
          "<div class=\"timePeriod\">+" + fmt(s.drink_buff_bonus) + " " + fmt(s.drink_buff_stat).toUpperCase() + " checks, " + fmt(s.drink_buff_minutes_left) + "m left</div>"
          : "") +
        (isTruthy(s.unique_buff1_active) ?
          "<div class=\"statRow\"><span>Boon</span><span>" + fmt(s.unique_buff1_name) + "</span></div>" +
          "<div class=\"timePeriod\">+" + fmt(s.unique_buff1_bonus) + " " + fmt(s.unique_buff1_stat).toUpperCase() + ", " + fmt(s.unique_buff1_minutes_left) + "m left</div>"
          : "") +
        (isTruthy(s.unique_buff2_active) ?
          "<div class=\"statRow\"><span>Boon</span><span>" + fmt(s.unique_buff2_name) + "</span></div>" +
          "<div class=\"timePeriod\">+" + fmt(s.unique_buff2_bonus) + " " + fmt(s.unique_buff2_stat).toUpperCase() + ", " + fmt(s.unique_buff2_minutes_left) + "m left</div>"
          : "") +
        (isTruthy(s.unique_buff3_active) ?
          "<div class=\"statRow\"><span>Boon</span><span>" + fmt(s.unique_buff3_name) + "</span></div>" +
          "<div class=\"timePeriod\">+" + fmt(s.unique_buff3_bonus) + " " + fmt(s.unique_buff3_stat).toUpperCase() + ", " + fmt(s.unique_buff3_minutes_left) + "m left</div>"
          : "")
        : "");
  }
  function isTruthy(v) { return v === true || v === "true"; }
  window.setInterval(renderStatSidebar, 400);
  document.addEventListener("DOMContentLoaded", renderStatSidebar);
})();
</script>

<dialog id="ampSLModal">
  <header>
    <h2>⚔ Save &amp; Load</h2>
    <button class="ampClose" onclick="document.getElementById('ampSLModal').close()" title="Close">✕</button>
  </header>

  </footer>
</dialog>

<div class="ampToast" id="ampToast"></div>

<script>
(function() {
  var SLOTS = 6;
  var KEY_PREFIX = 'amp_save_v1_slot_';
  var KEY_META   = 'amp_save_v1_meta_';

  // ── helpers ──────────────────────────────────────────────────────────────
  function toast(msg, ms) {
    var el = document.getElementById('ampToast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function() { el.classList.remove('show'); }, ms || 2000);
  }

  function slotKey(n)    { return KEY_PREFIX + n; }
  function metaKey(n)    { return KEY_META + n; }

  function readSlot(n) {
    var raw = localStorage.getItem(slotKey(n));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch(e) { return null; }
  }

  function readMeta(n) {
    var raw = localStorage.getItem(metaKey(n));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch(e) { return null; }
  }

  function writeSlot(n, cookieStr, meta) {
    localStorage.setItem(slotKey(n), JSON.stringify({ cookie: cookieStr }));
    localStorage.setItem(metaKey(n), JSON.stringify(meta));
  }

  function deleteSlot(n) {
    localStorage.removeItem(slotKey(n));
    localStorage.removeItem(metaKey(n));
  }

  function buildMeta() {
    var s = window.stats || {};
    var name     = s.name     || 'Unknown';
    var cls      = s.class_name || (s.character_class || '');
    var hp       = (s.hp_current !== undefined) ? (s.hp_current + '/' + s.hp_max + ' HP') : '';
    var location = s.calendar_date ? (s.calendar_date + (s.clock_time ? ' · ' + s.clock_time : '')) : '';
    var scene    = s.sceneName ? s.sceneName.replace(/_/g,' ') : '';
    var label    = [name, cls ? ('· ' + cls) : '', hp ? ('· ' + hp) : ''].filter(Boolean).join(' ');
    var sub      = [location, scene].filter(Boolean).join(' — ');
    return { label: label, sub: sub, saved: new Date().toLocaleString() };
  }

  // ── render ───────────────────────────────────────────────────────────────
  function render() {
    var list = document.getElementById('ampSlotList');
    if (!list) return;
    var html = '';
    for (var i = 1; i <= SLOTS; i++) {
      var meta = readMeta(i);
      var occupied = !!meta;
      html += '<div class="ampSlot">';
      html += '<span class="ampSlotNum">' + i + '</span>';
      if (occupied) {
        html += '<span class="ampSlotLabel"><b>' + esc(meta.label) + '</b><small>' +
                esc(meta.sub) + '</small><small style="color:#bbb">' + esc(meta.saved) + '</small></span>';
      } else {
        html += '<span class="ampSlotLabel empty">— Empty —</span>';
      }
      html += '<span class="ampSlotBtns">';
      html += '<button class="ampBtnSave" onclick="ampSaveLoad.save(' + i + ')" title="Save to slot ' + i + '">💾 Save</button>';
      if (occupied) {
        html += '<button class="ampBtnLoad" onclick="ampSaveLoad.load(' + i + ')" title="Load slot ' + i + '">📂 Load</button>';
        html += '<button class="ampBtnDel"  onclick="ampSaveLoad.del(' + i + ')"  title="Delete slot ' + i + '">🗑</button>';
      }
      html += '</span></div>';
    }
    list.innerHTML = html;
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── public API ───────────────────────────────────────────────────────────
  window.ampSaveLoad = {
    open: function() {
      render();
      document.getElementById('ampSLModal').showModal();
    },

    save: function(n) {
      // Need an active scene on the page to capture state.
      // computeCookie is a ChoiceScript global in util.js.
      var s = window.stats;
      if (!s || !s.sceneName) {
        toast('Nothing to save yet — start a new game first.');
        return;
      }
      // Grab the active scene's temps + position from pseudoSave[""].
      var raw = null;
      if (window._global && _global.pseudoSave) raw = _global.pseudoSave[''];
      if (!raw && typeof pseudoSave !== 'undefined') raw = pseudoSave[''];
      if (!raw) {
        toast('Could not capture game state. Try clicking a choice first.');
        return;
      }
      writeSlot(n, raw, buildMeta());
      render();
      toast('✔ Saved to Slot ' + n + '.');
    },

    load: function(n) {
      var slot = readSlot(n);
      if (!slot) { toast('Slot ' + n + ' is empty.'); return; }
      if (!confirm('Load Slot ' + n + '? Unsaved progress will be lost.')) return;
      document.getElementById('ampSLModal').close();
      // Parse the cookie string and hand it back to ChoiceScript.
      var state;
      try { state = JSON.parse(slot.cookie); } catch(e) { toast('Save data corrupted.'); return; }
      clearScreen(function() { restoreGame(state, null, true); });
    },

    del: function(n) {
      if (!confirm('Delete Slot ' + n + '?')) return;
      deleteSlot(n);
      render();
      toast('Slot ' + n + ' deleted.');
    },

    exportAll: function() {
      var out = {};
      for (var i = 1; i <= SLOTS; i++) {
        var s = readSlot(i);
        var m = readMeta(i);
        if (s) out['slot_' + i] = { save: s, meta: m };
      }
      if (!Object.keys(out).length) { toast('No saves to export.'); return; }
      var blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'amp_mercenary_saves_' + Date.now() + '.json';
      a.click();
      toast('Saves exported.');
    },

    importPrompt: function() {
      document.getElementById('ampImportFile').click();
    },

    importFile: function(evt) {
      var file = evt.target.files[0];
      if (!file) return;
      evt.target.value = '';
      var reader = new FileReader();
      reader.onload = function(e) {
        var data;
        try { data = JSON.parse(e.target.result); } catch(err) { toast('Invalid save file.'); return; }
        var count = 0;
        for (var key in data) {
          var m = key.match(/^slot_(\d+)$/);
          if (!m) continue;
          var n = parseInt(m[1], 10);
          if (n < 1 || n > SLOTS) continue;
          var entry = data[key];
          if (entry && entry.save && entry.meta) {
            localStorage.setItem(slotKey(n), JSON.stringify(entry.save));
            localStorage.setItem(metaKey(n), JSON.stringify(entry.meta));
            count++;
          }
        }
        render();
        toast('Imported ' + count + ' save(s).');
      };
      reader.readAsText(file);
    }
  };

  // Close modal if user clicks the backdrop
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('ampSLModal');
    if (modal) modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.close();
    });
  });
})();
</script>

<!-- ═══════════════════════════════════════════════════════════
     KOKORO READ-ALOUD SYSTEM
     Reads narrative paragraphs aloud via the Mempalace/Kokoro TTS
     server, with paragraph highlighting and look-ahead buffering
     so playback never stalls waiting on the next line.
     Hooks into ChoiceScript globals: printParagraph, clearScreen

<dialog id="ttsSettingsModal">
  <header>

<div id="ttsPanel">
  <button id="ttsPlayPause" title="Play/Pause">&#9658;</button>
  <button id="ttsStop" title="Stop">&#9632;</button>
  <span id="ttsStatus">Ready</span>
  <button id="ttsGear" title="Settings">&#9881;</button>
</div>
<button id="ttsLauncher" title="Read this story aloud">🔊</button>

<script>
(function () {
  var LOOKAHEAD = 2; // server caps concurrent Kokoro generation at 2 anyway
  var PARAGRAPH_PAUSE_MS = 400; // brief breath between paragraphs so lines don't run together
  var STORAGE_KEY = 'tts_reader_settings_v1';

  var savedSettings = {};
  try { savedSettings = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}
  var settings = {
    serverUrl: savedSettings.serverUrl || '',
    kokoroVoice: savedSettings.kokoroVoice || '',
    edgeVoice: savedSettings.edgeVoice || 'en-US-AriaNeural',
    speed: savedSettings.speed || 1.0,
    autoAdvance: !!savedSettings.autoAdvance,
    fastStart: savedSettings.fastStart !== false // default on
  };

  var state = {
    paragraphs: [],   // [{ el, text, hash }]
    index: -1,
    playing: false,
    enabled: false,
    cache: new Map(), // idx -> { status, promise, url }
    inflight: new Set(), // AbortControllers for requests currently on the wire
    sessionId: 0,
    listenMode: false,
    autoResumeNextPage: false,
    audio: new Audio()
  };

  function hashText(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return 'p' + (h >>> 0).toString(36);
  }

  function fetchTTS(text, hash, forceEdge, signal) {
    if (!settings.serverUrl) return Promise.reject(new Error('No server URL set — click ⚙ to configure.'));
    var base = settings.serverUrl.replace(/\/+$/, '');
    return fetch(base + '/tts', {
      method: 'POST',
      signal: signal,
      headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
      body: JSON.stringify({
        text: text,
        text_hash: hash,
        character_name: 'Narrator',
        message_id: hash,
        voice: settings.edgeVoice,
        kokoro_voice: settings.kokoroVoice || null,
        speed: settings.speed,
        force_edge: !!forceEdge
      })
    }).then(function (res) {
      if (!res.ok) throw new Error('Server responded ' + res.status);
      return res.blob();
    }).then(function (blob) {
      return URL.createObjectURL(blob);
    });
  }

  // Kokoro is CPU-bound: two jobs at once each run slower, so the chunk needed
  // NEXT arrives later than if it had the CPU to itself (measured on this
  // machine: 11.4s alone vs 16.1s alongside another job). So Kokoro requests
  // go out one at a time, nearest upcoming chunk first. Edge requests skip the
  // queue - they cost no local CPU. Queued requests from a page the player has
  // already left are dropped before they're ever sent.
  var kokoroQueue = [];
  var kokoroBusy = false;

  function pumpKokoro() {
    if (kokoroBusy) return;
    kokoroQueue = kokoroQueue.filter(function (job) {
      if (job.session === state.sessionId) return true;
      job.resolve(null);
      return false;
    });
    if (!kokoroQueue.length) return;
    var best = 0, bestScore = Infinity;
    kokoroQueue.forEach(function (job, i) {
      var d = job.idx - state.index;
      var score = d >= 0 ? d : 10000 - d; // chunks ahead of the playhead first, nearest first
      if (score < bestScore) { best = i; bestScore = score; }
    });
    var next = kokoroQueue.splice(best, 1)[0];
    kokoroBusy = true;
    next.run().then(next.resolve, next.reject).then(function () {
      kokoroBusy = false;
      pumpKokoro();
    });
  }

  function scheduleKokoro(idx, session, run) {
    return new Promise(function (resolve, reject) {
      kokoroQueue.push({ idx: idx, session: session, run: run, resolve: resolve, reject: reject });
      pumpKokoro();
    });
  }

  function ensureFetched(idx) {
    if (idx < 0 || idx >= state.paragraphs.length) return;
    if (state.cache.has(idx)) return;
    var entry = { status: 'pending', url: null };
    state.cache.set(idx, entry);
    var mySession = state.sessionId;
    var p = state.paragraphs[idx];
    var controller = new AbortController();
    var send = function () {
      state.inflight.add(controller);
      return fetchTTS(p.text, p.hash, p.forceEdge, controller.signal).then(function (url) {
        state.inflight.delete(controller);
        return url;
      }, function (e) {
        state.inflight.delete(controller);
        throw e;
      });
    };
    var request = p.forceEdge ? send() : scheduleKokoro(idx, mySession, send);
    entry.promise = request.then(function (url) {
      if (mySession !== state.sessionId) { if (url) URL.revokeObjectURL(url); return null; }
      entry.status = 'ready';
      entry.url = url;
      return url;
    }).catch(function (e) {
      if (mySession !== state.sessionId) return null; // cancelled by a page turn / Stop - not an error
      console.warn('[TTS Reader] failed for paragraph', idx, e);
      entry.status = 'error';
      setStatus('TTS error: ' + e.message);
      return null;
    });
  }

  function prefetchWindow(idx) {
    for (var i = idx; i <= idx + LOOKAHEAD; i++) ensureFetched(i);
  }

  function highlight(idx) {
    clearHighlight();
    var p = state.paragraphs[idx];
    if (!p) return;
    p.el.classList.add('ttsHighlight');
    var rect = p.el.getBoundingClientRect();
    var inView = rect.top >= 60 && rect.bottom <= window.innerHeight - 60;
    if (!inView) p.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function clearHighlight() {
    state.paragraphs.forEach(function (p) { p.el.classList.remove('ttsHighlight'); });
  }

  function playFrom(idx) {
    var mySession = state.sessionId;
    if (idx >= state.paragraphs.length) {
      state.playing = false;
      state.index = idx;
      updatePanel();
      setStatus('Waiting for more story…');
      return;
    }
    state.index = idx;
    state.playing = true;
    updatePanel();
    highlight(idx);
    prefetchWindow(idx);
    setStatus('Loading ' + (idx + 1) + '/' + state.paragraphs.length + '…');

    var entry = state.cache.get(idx);
    entry.promise.then(function (url) {
      if (mySession !== state.sessionId) return;
      if (!url) { playFrom(idx + 1); return; }
      setStatus('Reading ' + (idx + 1) + '/' + state.paragraphs.length);
      state.audio.src = url;
      state.audio.play().catch(function (e) { console.warn('[TTS Reader] play() failed', e); });
    });
  }

  state.audio.addEventListener('ended', function () {
    if (!state.playing) return;
    var mySession = state.sessionId;
    setTimeout(function () {
      if (mySession !== state.sessionId || !state.playing) return;
      playFrom(state.index + 1);
    }, PARAGRAPH_PAUSE_MS);
  });
  state.audio.addEventListener('error', function () {
    if (!state.playing) return;
    setStatus('Playback error, skipping…');
    playFrom(state.index + 1);
  });

  function play() {
    state.listenMode = true; // standing intent to keep listening across page turns
    if (state.paragraphs.length === 0) { setStatus('No story text yet.'); return; }
    if (state.index === -1 || state.index >= state.paragraphs.length) {
      playFrom(0);
    } else if (state.audio.src) {
      state.playing = true;
      state.audio.play();
      updatePanel();
      setStatus('Reading ' + (state.index + 1) + '/' + state.paragraphs.length);
    } else {
      playFrom(state.index);
    }
  }

  function pause() {
    state.listenMode = false; // explicit pause cancels auto-resume on the next page
    state.playing = false;
    state.audio.pause();
    updatePanel();
    setStatus('Paused.');
  }

  function stop() {
    state.listenMode = false;
    state.sessionId++;
    state.playing = false;
    state.audio.pause();
    state.audio.removeAttribute('src');
    clearHighlight();
    state.cache.forEach(function (e) { if (e.url) URL.revokeObjectURL(e.url); });
    state.cache.clear();
    // Cancel requests still on the wire so the next page's first Kokoro job
    // isn't stuck behind a stale one, then drop this session's queued jobs.
    // (sessionId was bumped above, so the aborts read as cancellations.)
    state.inflight.forEach(function (c) { c.abort(); });
    state.inflight.clear();
    pumpKokoro();
    state.index = -1;
    updatePanel();
  }

  function jumpTo(idx) {
    state.audio.pause();
    state.audio.removeAttribute('src');
    playFrom(idx);
  }

  // --- hook into the ChoiceScript engine ---
  var _origPrintParagraph = window.printParagraph;
  window.printParagraph = function (msg, parent) {
    var p = _origPrintParagraph(msg, parent);
    if (p && state.enabled) onParagraphAdded(p);
    return p;
  };

  var _origClearScreen = window.clearScreen;
  window.clearScreen = function (code) {
    onScreenClear();
    return _origClearScreen(code);
  };

  function onScreenClear() {
    if (!state.enabled) return;
    var shouldResume = state.listenMode && settings.autoAdvance;
    stop();
    state.listenMode = shouldResume; // stop() clears this; restore it if we're auto-continuing
    state.paragraphs = [];
    state.autoResumeNextPage = shouldResume;
    setStatus(shouldResume ? 'Waiting for next page…' : 'Ready');
  }

  // Splits off just the first sentence of a fresh page's opening paragraph
  // so the reader has something short to synthesize and start playing
  // immediately, instead of waiting on the whole (often multi-sentence)
  // paragraph before any audio can begin. Only applied to the page
  // opener - every choice in this game re-triggers this cold-start cost,
  // unlike RoyalRoad where it's a one-time-per-chapter delay.
  function splitOpeningSentence(text) {
    var m = text.match(/^(.{1,300}?[.!?])(\s+)([\s\S]*)$/);
    if (!m) return [text];
    var rest = (m[3] || '').trim();
    if (!rest) return [text];
    return [m[1], rest];
  }

  function pushParagraphChunk(el, text, forceEdge) {
    var idx = state.paragraphs.length;
    state.paragraphs.push({ el: el, text: text, hash: hashText(text), forceEdge: !!forceEdge });
    return idx;
  }

  // HUD/status lines (location headers, clock & HP bars, combat toasts, loot
  // popups) aren't narrative prose and sound like garbage read aloud. They
  // have a consistent structural signature in this game's scenes: either a
  // "◈ TITLE" section header, or an entire line wrapped in a single pair
  // of literal square brackets (e.g. "[⏳ Hour: 10:30 | Hit Points: 7/7]").
  function isHudLine(text) {
    if (text.charAt(0) === '◈') return true; // section/location header
    if (text.charAt(0) === '[' && text.charAt(text.length - 1) === ']') return true; // status/combat toast
    return false;
  }

  // A paragraph can mix HUD chrome with real prose: ChoiceScript merges
  // consecutive script lines (e.g. a "◈ TITLE" header, a *line_break, then the
  // opening prose) into ONE <p>. HUD lines are always bold, so strip just
  // those <b> pieces and keep the narrative that remains.
  function getNarrativeText(pEl) {
    var clone = pEl.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('b'), function (b) {
      if (isHudLine(b.textContent.trim())) b.parentNode.removeChild(b);
    });
    Array.prototype.forEach.call(clone.querySelectorAll('br'), function (br) {
      br.parentNode.replaceChild(document.createTextNode(' '), br);
    });
    return clone.textContent.replace(/\s+/g, ' ').trim();
  }

  function onParagraphAdded(pEl) {
    var text = getNarrativeText(pEl);
    if (!text || isHudLine(text)) return;

    var isPageOpener = state.paragraphs.length === 0;
    var chunks = isPageOpener ? splitOpeningSentence(text) : [text];

    var firstIdx = -1;
    chunks.forEach(function (chunkText, chunkIdx) {
      // Only the very first chunk of a fresh page's opener goes to Edge - it's
      // the one thing blocking any audio at all, and Edge has no CPU cost or
      // concurrency cap. Everything else (including the rest of this same
      // paragraph) still uses Kokoro.
      var useEdge = settings.fastStart && isPageOpener && chunkIdx === 0;
      var idx = pushParagraphChunk(pEl, chunkText, useEdge);
      if (firstIdx === -1) firstIdx = idx;
    });

    pEl.style.cursor = 'pointer';
    pEl.title = 'Click to read from here';
    pEl.addEventListener('click', function () { jumpTo(firstIdx); });

    if (isPageOpener && state.autoResumeNextPage) {
      state.autoResumeNextPage = false;
      playFrom(0);
    } else if (state.playing) {
      prefetchWindow(state.index);
    }
  }

  // --- UI wiring ---
  var panel = document.getElementById('ttsPanel');
  var launcher = document.getElementById('ttsLauncher');

  function updatePanel() {
    document.getElementById('ttsPlayPause').innerHTML = state.playing ? '&#10074;&#10074;' : '&#9658;';
  }
  function setStatus(text) {
    var el = document.getElementById('ttsStatus');
    if (el) el.textContent = text;
  }

  launcher.addEventListener('click', function () {
    state.enabled = true;
    launcher.style.display = 'none';
    panel.style.display = 'flex';
    if (state.paragraphs.length === 0) {
      Array.prototype.forEach.call(document.querySelectorAll('#text > p'), function (pEl) {
        if (pEl.innerText.trim()) onParagraphAdded(pEl);
      });
    }
    play();
  });
  document.getElementById('ttsPlayPause').addEventListener('click', function () {
    if (state.playing) pause(); else play();
  });
  document.getElementById('ttsStop').addEventListener('click', stop);
  document.getElementById('ttsGear').addEventListener('click', function () {
    document.getElementById('ttsServerUrl').value = settings.serverUrl;
    document.getElementById('ttsKokoroVoice').value = settings.kokoroVoice;
    document.getElementById('ttsEdgeVoice').value = settings.edgeVoice;
    document.getElementById('ttsSpeed').value = settings.speed;
    document.getElementById('ttsSpeedLabel').textContent = Number(settings.speed).toFixed(2) + 'x';
    document.getElementById('ttsAutoAdvance').checked = settings.autoAdvance;
    document.getElementById('ttsFastStart').checked = settings.fastStart;
    document.getElementById('ttsSettingsModal').showModal();
  });
  document.getElementById('ttsSpeed').addEventListener('input', function (e) {
    document.getElementById('ttsSpeedLabel').textContent = Number(e.target.value).toFixed(2) + 'x';
  });

  window.TTSReader = {
    saveSettings: function () {
      settings.serverUrl = document.getElementById('ttsServerUrl').value.trim();
      settings.kokoroVoice = document.getElementById('ttsKokoroVoice').value;
      settings.edgeVoice = document.getElementById('ttsEdgeVoice').value;
      settings.speed = parseFloat(document.getElementById('ttsSpeed').value);
      settings.autoAdvance = document.getElementById('ttsAutoAdvance').checked;
      settings.fastStart = document.getElementById('ttsFastStart').checked;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
      document.getElementById('ttsSettingsModal').close();
    }
  };
})();
</script>
</body>

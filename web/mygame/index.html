<style>
#statSidebar {
  position: fixed;
  top: 0.75em;
  right: 0.75em;
  width: 290px;
  max-height: 92vh;
  overflow-y: auto;
  background: rgba(247,244,241,0.95);
  border: 1px solid rgba(0,0,0,0.25);
  border-radius: 6px;
  padding: 0.75em 1em;

}
#statSidebar h3 {

  border-bottom: 1px solid rgba(0,0,0,0.2);
  padding-bottom: 0.35em;
}
#statSidebar .statRow {
  display: flex;
  justify-content: space-between;
  gap: 0.75em;
}
#statSidebar .statRow > span:first-child {
  color: rgba(0,0,0,0.6);
  white-space: nowrap;
}
#statSidebar .statRow > span:last-child {
  text-align: right;
  font-weight: 600;
}
#statSidebar .timePeriod {
  margin-top: -0.1em;
  margin-bottom: 0.2em;
  font-size: 0.92em;
  font-style: italic;
  color: rgba(0,0,0,0.55);
  text-align: right;
}
#statSidebar .abilityGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.25em 0.5em;
  margin-top: 0.5em;
}
#statSidebar .boon {
  font-size: 0.85em;
  font-weight: bold;
}
#statSidebar .boonUp {
  color: #3a9b4a;
}
#statSidebar .boonIdle {
  opacity: 0.5;
  text-decoration: line-through;
}
#statSidebar .sectionDivider {
  margin: 0.65em 0 0.5em 0;
  border: none;
  border-top: 1px solid rgba(0,0,0,0.15);
}

/* ── Spellbook section (proof of concept, read-only) ──────────────────────────────────────────────────────
   A collapsed <details> so it costs nothing until opened. Native <details>/<summary> rather than a
   JS-driven collapse because the sidebar's innerHTML is replaced wholesale every 400ms: an
   open/closed flag held in JS would be lost ~2.5x a second, whereas the browser tracks the open state
   on the element itself, so writing the `open` attribute back into the markup each render restores it. */
#statSidebar .spellbook {
  border-top: 1px solid rgba(0,0,0,0.15);
  margin-top: 0.65em;
  padding-top: 0.35em;
}
#statSidebar .spellbook > summary {
  cursor: pointer;
  list-style: none;
  font-size: 0.95em;
  font-weight: 600;
  color: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  gap: 0.35em;
  padding: 0.15em 0;
  user-select: none;
}
#statSidebar .spellbook > summary::-webkit-details-marker { display: none; }
#statSidebar .spellbook > summary::before {
  content: "\25B8";                 /* small right-pointing triangle */
  font-size: 0.8em;
  color: rgba(0,0,0,0.45);
  transition: transform 0.12s ease;
}
#statSidebar .spellbook[open] > summary::before { transform: rotate(90deg); }
#statSidebar .spellbook > summary:hover { color: rgba(0,0,0,0.9); }
#statSidebar .spellTabs {
  display: flex;
  gap: 0.3em;
  margin: 0.35em 0 0.5em 0;
  flex-wrap: wrap;
}
#statSidebar .spellTab {
  border: 1px solid rgba(0,0,0,0.2);
  background: rgba(255,255,255,0.5);
  border-radius: 4px;
  padding: 0.15em 0.4em 0.15em 0.3em;
  font: inherit;
  font-size: 0.8em;
  line-height: 1;
  color: rgba(0,0,0,0.75);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.3em;
  /* Tabs with nothing under them are dimmed rather than removed, so the row keeps a stable shape and
     does not reflow when a character learns a higher-level spell. */
  opacity: 0.45;
}
/* A numbered tab is nothing but its orb, so the horizontal padding shrinks to roughly the border
   plus a hair of breathing room. This is what buys the fifth tab its place on the row. */
#statSidebar .spellTab:not([data-spell-label]) { padding: 0.15em 0.2em; }
#statSidebar .spellTab:not(.spellTabEmpty) { opacity: 1; }
#statSidebar .spellTab:hover { border-color: rgba(0,0,0,0.45); }
#statSidebar .spellTab[aria-pressed="true"] {
  background: #7a3e1d;              /* the sidebar's existing picked-target rust */
  border-color: #7a3e1d;
  color: #fff;
}
#statSidebar .spellTab img {
  width: 17px; height: 17px;
  object-fit: contain;
  display: block;
  /* The art is a full-detail 5e icon asset; at 17px it reads as noise, so lean on shape not detail. */
  filter: saturate(0.85);
}
/* A numbered tab shows ONLY the orb, so it may be a touch larger than the tab that also has a word
   beside it -- it is the sole thing identifying the level. */
#statSidebar .spellTab:not([data-spell-label]) img { width: 19px; height: 19px; }
#statSidebar .spellTab[aria-pressed="true"] img { filter: none; }
#statSidebar .spellList { display: flex; flex-direction: column; gap: 0.15em; }
#statSidebar .spellRow {
  display: flex;
  align-items: center;
  gap: 0.45em;
  width: 100%;
  border: none;
  background: none;
  font: inherit;
  font-size: 0.85em;
  text-align: left;
  padding: 0.2em 0.3em;
  margin: 0 -0.3em;
  border-radius: 3px;
  color: inherit;
  cursor: pointer;
}
#statSidebar .spellRow:hover { background: rgba(0,0,0,0.06); }
#statSidebar .spellRow[aria-pressed="true"] { background: rgba(122,62,29,0.14); font-weight: 600; }
#statSidebar .spellRow img { width: 18px; height: 18px; object-fit: contain; flex: 0 0 auto; }
/* Fallback for spells with no art in ICONS/ (and any spell outside the generated --batch set): an
   initials chip, so the row still reads as a list item instead of a broken image. */
#statSidebar .spellInitials {
  width: 18px; height: 18px;
  flex: 0 0 auto;
  border-radius: 3px;
  background: rgba(0,0,0,0.07);
  border: 1px solid rgba(0,0,0,0.15);
  color: rgba(0,0,0,0.6);
  font-size: 8.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
#statSidebar .spellName { flex: 1 1 auto; }
#statSidebar .spellLvl { font-size: 0.8em; color: rgba(0,0,0,0.5); font-weight: 400; }
#statSidebar .spellDetail {
  margin-top: 0.4em;
  padding: 0.4em 0.5em;
  border-left: 2px solid rgba(122,62,29,0.45);
  background: rgba(122,62,29,0.06);
  font-size: 0.85em;
  line-height: 1.5;
  color: rgba(0,0,0,0.75);
  border-radius: 0 3px 3px 0;
}
#statSidebar .spellDetail b { color: rgba(0,0,0,0.9); }
#statSidebar .spellDetail .spellMeta { display: block; margin-top: 0.2em; font-size: 0.85em; color: rgba(0,0,0,0.55); }
#statSidebar .spellEmpty { font-size: 0.85em; color: rgba(0,0,0,0.5); padding: 0.2em 0; }
#statSidebar .spellNote { font-size: 0.78em; color: rgba(0,0,0,0.45); margin-top: 0.4em; line-height: 1.4; }
/* Combat state (2026-09-27): the sidebar's own header gets a small badge, and date/time/weather/purse swap for
   a live turn-order list (renderStatSidebar below) -- reusing the combat_turn_kind_N/_slot_N stats the ChoiceScript
   engine already builds, not a second panel, so this never fights the sidebar for space or attention.
   Do not join those two families with a star-then-slash inside a comment here: that pair closes
   the comment early, the rest of the line is then parsed as a selector, and the next rule is
   silently dropped from the CSSOM -- which is exactly how this h3 lost its display:flex. */
/* Header layout: the name is the only element allowed to absorb slack -- flex:1 1 auto plus
   min-width:0 lets it shrink and wrap in place (overflow-wrap guards an unbreakable generated
   name) -- while the badge holds a fixed flex-basis of its own with the label centered inside
   it, so COMBAT sits the same distance from the class name no matter how long the name gets.
   Previously the badge was a plain flex sibling shoved over by `margin-left: auto`, so it landed
   at whatever offset the leftover space happened to leave: 0.5em on a short name, and on its own
   flush-right line once `flex-wrap: wrap` dropped it there, which is what read as COMBAT being
   glued to the class name. flex-wrap is dropped for the same reason -- the name now wraps
   internally and the badge never jumps to a second row.
   The 6.5em basis is in the badge's own font (0.7em of the h3's 1.05em of the sidebar's 0.82em,
   ~9.6px), so it measures ~63px of content width against ~45px of glyphs for "COMBAT". Nothing
   in this game sets box-sizing:border-box, so the basis is content width, padding excluded. */
#statSidebar h3 { display: flex; align-items: center; gap: 0.75em; }
#statSidebar h3 > span:first-child { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
#statSidebar .combatBadge {
  font-size: 0.7em;
  font-weight: bold;
  letter-spacing: 0.05em;
  color: #a12b2b;
  border: 1px solid #a12b2b;
  border-radius: 3px;
  padding: 0.1em 0.4em;
  white-space: nowrap;
  flex: 0 0 6.5em;
  text-align: center;
  margin-left: auto;
}
#statSidebar .turnRow {
  width: 100%;
  border: none;
  background: none;
  font: inherit;
  text-align: left;
  padding: 0.15em 0.3em;
  margin: 0 -0.3em;
  border-radius: 3px;
  color: inherit;
}
button#statSidebar .turnRow,
#statSidebar button.turnRow {
  cursor: pointer;
}
/* ── Combatant stat card ──────────────────────────────────────────────────────────────────────────────────
   A real DOM element, NOT a title attribute: the browser's own tooltip is an unstyleable OS widget
   (that plain black-bordered box), so a sleek card is only possible by building one. #csTip is a
   child of <body>, never of #statSidebar, because renderStatSidebar replaces the sidebar's innerHTML
   every 400ms and would destroy a tooltip living inside it. */
#csTip {
  position: fixed;
  z-index: 1200;
  pointer-events: none;          /* so the row underneath keeps its :hover styling, and so
                                    elementFromPoint (refreshTip) never finds the card instead */
  opacity: 0;
  transition: opacity 0.1s ease;
  background: #211c19;           /* warm near-black, sits with the sidebar's browns */
  color: #f2ece6;
  border: 1px solid rgba(161,43,43,0.5);   /* rust, the same accent as the COMBAT badge */
  border-radius: 7px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.38), 0 1px 2px rgba(0,0,0,0.3);
  padding: 8px 10px 9px;
  font: 500 12px/1.4 Helvetica, Arial, sans-serif;
  max-width: 280px;
  white-space: nowrap;
}
#csTip.on { opacity: 1; }
#csTip .tHd {                    /* the combatant's name */
  font-weight: 700;
  font-size: 12.5px;
  color: #fff;
  margin-bottom: 5px;
}
#csTip .tMeta {                  /* AC / attack bonus / damage dice */
  font-size: 11px;
  color: #a99d94;
  padding-bottom: 6px;
  margin-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.09);
}
#csTip .tMeta b { color: #cbbdb2; font-weight: 600; }
#csTip .tGrid {                  /* 2 columns x 3 rows: STR DEX / CON INT / WIS CHA. A real grid so the
                                    columns align exactly -- the previous version padded with non-breaking
                                    spaces, which only ever approximated this. */
  display: grid;
  grid-template-columns: auto auto;
  column-gap: 15px;
  row-gap: 2px;
}
#csTip .tAb { font-size: 11.5px; }
#csTip .tAb b { color: #d98b7a; font-weight: 700; margin-right: 4px; }   /* ability label */
#csTip .tAb s { color: #fff; font-weight: 600; text-decoration: none; }  /* the score */
#csTip .tAb i { font-style: normal; margin-left: 3px; font-size: 10.5px; }
#csTip .tAb i.pos { color: #86c295; }   /* positive modifier */
#csTip .tAb i.neg { color: #e08a8a; }   /* negative modifier */
#csTip .tAb i.zero { color: #8f837a; }
#csTip .tDead { color: #8f837a; font-size: 10.5px; margin-top: 6px; }
#statSidebar .turnRow[data-combatant] {
  cursor: help;
}
#statSidebar .turnRow > span:first-child {
  white-space: normal;   /* a name plus its range tag can be longer than "HP"/"AC" etc. -- wrap instead of
                             forcing the row (and the whole fixed-width sidebar) wider than it should be. */
}
#statSidebar .turnRowDead[data-combatant] {
  cursor: help;
}
#statSidebar .turnRow:hover:not(:disabled),
#statSidebar .turnRow:focus-visible:not(:disabled) {
  background: rgba(0,0,0,0.06);
}
#statSidebar .turnRowPicked {
  background: rgba(122,62,29,0.14);
  font-weight: 600;
}
#statSidebar .turnRowPicked > span:first-child { color: #7a3e1d; }
#statSidebar .turnRowDead {
  opacity: 0.45;
  cursor: default;
}
#statSidebar .turnRowSelf > span:first-child { font-weight: 600; }
#statSidebar .enemyName { color: #a12b2b; }   /* same rust as the COMBAT badge */
#statSidebar .allyName { color: #2a5f8f; }
#statSidebar .rangeTag {                      /* distance tag beside a combatant's name */
  font-weight: 400;
  font-size: 0.9em;
  color: rgba(0,0,0,0.5);
  margin-left: 0.3em;
}
#statSidebar .alertRow {                      /* derived "who's next / who's in reach" rows, above the turn list */
  font-size: 0.92em;
  padding: 2px 0;
}
#statSidebar .alertReach {                    /* enemies at range 0 -- the ones actually hitting you this round */
  color: #a12b2b;
  font-weight: 600;
}
#statSidebar .turnMain {                      /* a turn row's first cell: name line, plus an optional sub-line */
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#statSidebar .turnSub {                       /* "fighting <enemy>" under an ally's name. Same visual idiom as
                                                .timePeriod (smaller, italic, dim), but without its standalone
                                                margins, and wrapping freely since the panel is fixed-width. */
  font-size: 0.88em;
  font-style: italic;
  color: rgba(0,0,0,0.55);
  overflow-wrap: anywhere;
}
#statSidebar .turnRowPicked .enemyName { color: #7a3e1d; }   /* picked-target row already recolors the name; keep it */
@media (max-width: 960px) {
  #statSidebar { display: none !important; }
}
</style>

<body>
<div id="statSidebar"></div>
<script>
(function() {
  function fmt(v) { return (v === undefined || v === null) ? "" : v; }
  function renderStatSidebar() {
    var el = document.getElementById("statSidebar");
    if (!el) return;
    var s = window.stats;
    if (!s || !s.intake_completed || s.intake_completed === "false") {
      el.style.display = "none";
      return;
    }
    el.style.display = "";
    var inCombat = isTruthy(s.combat_engaged);
    var hpHtml = fmt(s.hp_current) + " / " + fmt(s.hp_max);
    if (s.temp_hp && Number(s.temp_hp) > 0) {
      hpHtml += " (+" + fmt(s.temp_hp) + ")";
    }
    var resourceHtml = "";
    if (s.character_class === "wizard") {
      resourceHtml = "<div class=\"statRow\"><span>Spell Slots</span><span>" + fmt(s.wizard_spell_slots) + " / " + fmt(s.wizard_spell_slots_max) + "</span></div>";
    } else if (s.character_class === "warlock") {
      resourceHtml = "<div class=\"statRow\"><span>Pact Slots</span><span>" + fmt(s.warlock_spell_slots) + " / " + fmt(s.warlock_spell_slots_max) + "</span></div>";
    } else if (s.character_class === "bard") {
      resourceHtml = "<div class=\"statRow\"><span>Spell Slots</span><span>" + fmt(s.bard_spell_slots) + " / " + fmt(s.bard_spell_slots_max) + "</span></div>";
    } else if (s.character_class === "fighter") {
      resourceHtml = "<div class=\"statRow\"><span>Second Wind</span><span>" + fmt(s.fighter_second_wind_uses) + " / " + fmt(s.fighter_second_wind_max) + "</span></div>";
    } else if (s.character_class === "barbarian") {
      resourceHtml = "<div class=\"statRow\"><span>Rage</span><span>" + fmt(s.barbarian_rage_uses) + " / " + fmt(s.barbarian_rage_max) + "</span></div>";
    }

    // Every quest listed in quest-data.js whose active(stats) is true.
    var activeQuestHtml = "";
    var activeQuests = (window.QUESTLOG || []).filter(function (q) {
      try { return q.active(s); } catch (e) { return false; }
    });
    if (activeQuests.length) {
      activeQuestHtml = "<hr class=\"sectionDivider\">" + activeQuests.map(function (q) {
        return "<div class=\"statRow\"><span>" + (activeQuests.length > 1 ? "Quest" : "Active Quest") + "</span><span style=\"font-size:0.9em;\">" + q.title + "</span></div><div class=\"timePeriod\">" + q.place + "</div>";
      }).join("");
    }

    var dayDisplay = s.day_of_week ? fmt(s.day_of_week) : ("Day " + fmt(s.campaign_day || "1"));
    var dateDisplay = fmt(s.calendar_date);
    var weatherDisplay = fmt(s.weather || "Clear");

    // Combat state (2026-09-27): date/time/weather/purse give way to a live turn-order list, reusing
    // combat_turn_kind_*/_slot_* (startup.txt/combat.txt) -- the exact order combat_roll_initiative built, not
    // a separate rendering of who's "in the fight". A living enemy row is a real button: clicking it sets
    // combat_player_chosen_target directly, no new ChoiceScript Scene needed for a plain data write like this
    // one (contrast with the Level Up button, which opens a page because taking a level is a real action) --
    // fight_pick_target (combat.txt) reads it before the player's next attack and clears it the instant that
    // slot dies, so a fight with this sidebar hidden (the sub-960px breakpoint below) still plays exactly as it
    // always has, picking the front-most living enemy on its own.
    var combatBadgeHtml = inCombat ? "<span class=\"combatBadge\">COMBAT</span>" : "";
    var bottomSectionHtml;
    if (inCombat) {
      var count = Number(s.combat_turn_count) || 0, chosen = Number(s.combat_player_chosen_target) || 0, rows = "";
      for (var ti = 1; ti <= count; ti++) {
        var kind = s["combat_turn_kind_" + ti], slot = Number(s["combat_turn_slot_" + ti]) || 0;
        if (kind === "player") {
          rows += "<div class=\"statRow turnRow turnRowSelf\"><span>" + fmt(s.name || "You") + "</span><span></span></div>";
        } else if (kind === "enemy" || kind === "ally") {
          var pfx = kind === "enemy" ? "combat_enemy" : "combat_ally";
          var cName = fmt(s[pfx + slot + "_name"]) || (kind === "enemy" ? "Enemy" : "Ally");
          var cHp = Number(s[pfx + slot + "_hp"]) || 0, cMax = Number(s[pfx + slot + "_max_hp"]) || 0;
          var cDead = kind === "enemy" && cHp <= 0;
          var cPicked = kind === "enemy" && !cDead && chosen === slot;
          // Enemy ranges are your own distance to that enemy. Ally ranges are that ally's distance to
          // WHATEVER ENEMY IT IS CURRENTLY FIGHTING, not to you -- the engine has no player-to-ally
          // distance (see combat.txt). An ally therefore gets a different tier WORD (allyTierName, so tier 0
          // reads "in melee" rather than the misleading "Engaged") and a dim sub-line naming who it is
          // actually locked up with, rather than leaving that to a hover tooltip nobody is obliged to find.
          var cRangeTag = cDead ? "" : " <span class=\"rangeTag\" title=\"" +
            (kind === "ally" ? "Distance from its own target" : "Distance from you") + "\">(" +
            (kind === "ally" ? allyTierName(s[pfx + slot + "_range"])
                             : rangeTierName(Number(s[pfx + slot + "_range"]) || 0)) + ")</span>";
          var cSub = kind === "ally" ? allyTargetLine(s, slot) : "";
          var cNameHtml = "<span class=\"turnMain\"><span><span class=\"" +
            (kind === "enemy" ? "enemyName" : "allyName") + "\">" + esc(cName) + "</span>" + cRangeTag +
            "</span>" + (cSub ? "<span class=\"turnSub\">" + cSub + "</span>" : "") + "</span>";
          if (kind === "enemy" && !cDead) {
            rows += "<button type=\"button\" class=\"statRow turnRow" + (cPicked ? " turnRowPicked" : "") +
              "\" data-target=\"" + slot + "\"" + combatantAttr(kind, slot) + "><span>" + cNameHtml + "</span><span>" + cHp + "/" + cMax + "</span></button>";
          } else {
            // A downed enemy still gets the card: its AC/Atk/abilities are what tell you whether the
            // remaining target is worth finishing, and a dead row that shows nothing reads as broken.
            rows += "<div class=\"statRow turnRow" + (cDead ? " turnRowDead" : "") + "\"" + combatantAttr(kind, slot) + "><span>" + cNameHtml +
              "</span><span>" + (cDead ? "Down" : (cHp + "/" + cMax)) + "</span></div>";
          }
        }
      }
      // Derived awareness rows (2026-09-28): the list below already prints every combatant's range and

    for (var i = 0; i < slots.length; i++) {
      var id = String(s[slots[i]] || "");
      if (!id || id === "none") continue;
      var meta = window.spellById && window.spellById(id);
      if (!meta) continue;                    // no spell-data entry: not ours to show
      out.push({
        id: id, meta: meta,
        // The game's own _desc prose, preferred over a bare name when it says more than the
        // placeholder the *_create defaults ship with.
        desc: String(s[slots[i] + "_desc"] || "").trim()
      });
    }
    return out;
  }
  function spellArt(id) {
    var uri = window.SPELL_ICONS && window.SPELL_ICONS[id];
    if (uri) return "<img src=\"" + uri + "\" alt=\"\">";
    // No art: an initials chip, so the row still reads as a list item rather than a broken image.
    var meta = window.spellById && window.spellById(id);
    var nm = (meta ? meta.name : id).replace(/[^A-Za-z ]/g, "");
    var ini = nm.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
    return "<span class=\"spellInitials\" aria-hidden=\"true\">" + esc(ini || "?") + "</span>";
  }
  function spellTabLabel(lvl) { return lvl === 0 ? "Cantrip" : "L" + lvl; }
  // The orb already carries the level as a Roman numeral, so a numbered tab spells it out twice and
  // costs 39px where a bare orb needs ~20px. With five tabs that difference is the whole budget --
  // the labelled row measured 43px spare, and a fifth labelled tab needs 44px, i.e. it wrapped.
  // Only the cantrip tab keeps its word, since "0" would not say what it means.
  function spellTabText(lvl) { return lvl === 0 ? "Cantrip" : ""; }
  function spellSectionHtml() {
    var spells = knownSpells();
    var orbs = window.SPELL_TAB_ORBS || {};
    var tabs = "", byLevel = {}, t, list, i;
    for (t = 0; t < SPELL_TABS.length; t++) {
      var lvl = SPELL_TABS[t];
      list = spells.filter(function (sp) { return sp.meta.level === lvl; });
      byLevel[lvl] = list;
      var orb = orbs[lvl] ? "<img src=\"" + orbs[lvl] + "\" alt=\"\">" : "";
      tabs += "<button type=\"button\" class=\"spellTab" + (list.length ? "" : " spellTabEmpty") +
              "\" data-spell-tab=\"" + lvl + "\" aria-pressed=\"" + (lvl === spellTab) + "\"" +
              (lvl === 0 ? " data-spell-label=\"Cantrip\"" : "") +
              // The orb IS the label for numbered tabs, so it doubles as the accessible name.
              (lvl === 0 ? "" : " title=\"Level " + lvl + "\" aria-label=\"Level " + lvl + "\"") +
              ">" + orb + spellTabText(lvl) + "</button>";
    }
    var shown = byLevel[spellTab] || [];
    var body, pick = null;
    if (!spells.length) {
      body = "<div class=\"spellEmpty\">No workings known.</div>";
    } else if (!shown.length) {
      body = "<div class=\"spellEmpty\">Nothing at " + spellTabLabel(spellTab).toLowerCase() + ".</div>";
    } else {
      var rows = "";
      for (i = 0; i < shown.length; i++) {
        var sp = shown[i];
        if (sp.id === spellPicked) pick = sp;
        rows += "<button type=\"button\" class=\"spellRow\" data-spell=\"" + esc(sp.id) + "\"" +
                " aria-pressed=\"" + (spellPicked === sp.id) + "\">" + spellArt(sp.id) +
                "<span class=\"spellName\">" + esc(sp.meta.name) + "</span>" +
                "<span class=\"spellLvl\">" + (sp.meta.level === 0 ? "C" : sp.meta.level) + "</span></button>";
      }
      body = "<div class=\"spellList\">" + rows + "</div>";
      if (pick) {
        // Many of the game's _desc fields already begin with the spell's name ("Blade Ward (Resist
        // ...)"), so prefixing <b>name</b> would read as "Blade Ward Blade Ward (Resist ...)".
        // Only bold the name when the description does NOT already start with it.
        var lead = pick.desc.indexOf(pick.meta.name) === 0 ? "" : "<b>" + esc(pick.meta.name) + "</b> ";
        body += "<div class=\"spellDetail\">" + lead + esc(pick.desc || pick.meta.name) +
                "<span class=\"spellMeta\">" + spellTabLabel(pick.meta.level) +
                (pick.meta.schools ? " \u00b7 " + esc(pick.meta.schools) : "") +
                " \u00b7 read-only preview</span></div>";
      }
    }
    return "<details class=\"spellbook\"" + (spellOpen ? " open" : "") + ">" +
             "<summary>Spellbook" + (spells.length ? " (" + spells.length + ")" : "") + "</summary>" +
             "<div class=\"spellTabs\">" + tabs + "</div>" + body +
             "<div class=\"spellNote\">Preview only \u2014 nothing here casts yet.</div>" +
           "</details>";
  }
  // Tab and spell clicks are delegated on the sidebar for the same reason the combatant card's are: the
  // rows are destroyed and rebuilt every 400ms, so a listener bound to a row would die with it. These
  // are separate listeners (not folded into the existing click handler) purely to keep the combat
  // target-picking path untouched.
  document.getElementById("statSidebar").addEventListener("click", function (ev) {
    var el = ev.target;
    if (!el || !el.closest) return;
    var tabBtn = el.closest("[data-spell-tab]");
    if (tabBtn) {
      var lvl = Number(tabBtn.getAttribute("data-spell-tab"));
      spellPicked = null;                    // a different level can't keep the old pin
      spellTab = lvl;                        // always re-select; an empty level shows its own empty note
      renderStatSidebar();
      return;
    }
    var spBtn = el.closest("[data-spell]");
    if (spBtn) {
      var id = spBtn.getAttribute("data-spell");
      spellPicked = spellPicked === id ? null : id;   // click again to unpin
      renderStatSidebar();
      return;
    }
    var sum = el.closest(".spellbook > summary");
    if (sum) {
      // Toggle through the module flag, because the 400ms re-render rebuilds the <details> element and
      // would otherwise drop whatever the user had just opened/closed.
      spellOpen = !spellOpen;
      renderStatSidebar();
    }
  });
  // Hovering a spell row reuses the stat card (showTip/placeTip) for its description, so both hover
  // surfaces in the sidebar behave identically. Anchored to the row's own box rather than the cursor,
  // since these rows are static -- unlike the combat turn-order list, which follows the pointer.
  document.getElementById("statSidebar").addEventListener("mouseover", function (ev) {
    var el = ev.target;
    if (!el || !el.closest) return;
    var row = el.closest("[data-spell]");
    if (!row) {
      if (tipKey && tipKey.indexOf("spell:") === 0) hideTip();
      return;
    }
    if (tipKey && tipKey.indexOf("spell:") !== 0) return;   // never steal the combatant card
    var id = row.getAttribute("data-spell");
    var r = row.getBoundingClientRect();
    showTip("spell:" + id, r.left + 30, r.top + r.height);
    paintSpellCard(id);                   // same painter refreshTip uses, so the two can't drift
  });

  // The #statSidebar div itself is never recreated (only its innerHTML, every render) -- one delegated listener
  // on the stable element, not on the buttons inside it, which get destroyed and rebuilt every 400ms poll.
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    while (t && t.id !== "statSidebar" && !(t.getAttribute && t.hasAttribute("data-target"))) t = t.parentNode;
    if (!t || !t.getAttribute || !t.hasAttribute("data-target")) return;
    var slot = Number(t.getAttribute("data-target"));
    if (!slot || !window.stats) return;
    window.stats.combat_player_chosen_target = slot;
    renderStatSidebar();
  });
  // Hover/focus plumbing for the stat card. Delegated on #statSidebar -- the same stable element the
  // click handler uses -- because the rows themselves are destroyed and rebuilt every 400ms, so any
  // listener bound directly to a row would die with it. mouseleave (not mouseout) is the reliable
  // "pointer left the panel" signal here; mouseout would fire on every internal move between the two
  // <span>s inside a row.
  document.getElementById("statSidebar").addEventListener("mouseover", function (ev) {
    var row = rowAt(ev);
    if (row) showTip(row.getAttribute("data-combatant"), ev.clientX, ev.clientY);
  });
  document.getElementById("statSidebar").addEventListener("mousemove", function (ev) {
    if (!tipKey) return;
    var row = rowAt(ev);
    if (row && row.getAttribute("data-combatant") === tipKey) { tipX = ev.clientX; tipY = ev.clientY; placeTip(); }
  });
  document.getElementById("statSidebar").addEventListener("mouseleave", hideTip);
  // Keyboard parity: the living-enemy rows are real <button>s, so they must show the card on focus too.
  document.getElementById("statSidebar").addEventListener("focusin", function (ev) {
    var row = rowAt(ev);
    if (!row) return;
    var r = row.getBoundingClientRect();
    showTip(row.getAttribute("data-combatant"), r.left + 40, r.top + r.height);
  });
  document.getElementById("statSidebar").addEventListener("focusout", hideTip);
  // refreshTip runs alongside every render so the card re-resolves against the rebuilt rows.
  window.setInterval(function () { renderStatSidebar(); refreshTip(); }, 400);
  document.addEventListener("DOMContentLoaded", renderStatSidebar);
})();
</script>

<dialog id="ampSLModal">
  <header>
    <h2>⚔ Save &amp; Load</h2>
    <button class="ampClose" onclick="document.getElementById('ampSLModal').close()" title="Close">✕</button>
  </header>
  <div class="ampSlotList" id="ampSlotList"></div>
  <footer>
    <button onclick="ampSaveLoad.exportAll()" title="Export all saves to a text file">📤 Export Saves</button>
    <button onclick="ampSaveLoad.importPrompt()" title="Import saves from a text file">📥 Import Saves</button>
    <input type="file" id="ampImportFile" accept=".json,.txt" style="display:none" onchange="ampSaveLoad.importFile(event)">
  </footer>

<div class="ampToast" id="ampToast"></div>

<script>
(function() {
  var SLOTS = 6;
  var KEY_PREFIX = 'amp_save_v1_slot_';
  var KEY_META   = 'amp_save_v1_meta_';

  // ── helpers ──────────────────────────────────────────────────────────────
  function toast(msg, ms) {
    var el = document.getElementById('ampToast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function() { el.classList.remove('show'); }, ms || 2000);
  }

  function slotKey(n)    { return KEY_PREFIX + n; }
  function metaKey(n)    { return KEY_META + n; }

  function readSlot(n) {
    var raw = localStorage.getItem(slotKey(n));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch(e) { return null; }
  }

  function readMeta(n) {
    var raw = localStorage.getItem(metaKey(n));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch(e) { return null; }
  }

  function writeSlot(n, cookieStr, meta) {
    localStorage.setItem(slotKey(n), JSON.stringify({ cookie: cookieStr }));
    localStorage.setItem(metaKey(n), JSON.stringify(meta));
  }

  function deleteSlot(n) {
    localStorage.removeItem(slotKey(n));
    localStorage.removeItem(metaKey(n));
  }

  function buildMeta() {
    var s = window.stats || {};
    var name     = s.name     || 'Unknown';
    var cls      = s.class_name || (s.character_class || '');
    var hp       = (s.hp_current !== undefined) ? (s.hp_current + '/' + s.hp_max + ' HP') : '';
    var location = s.calendar_date ? (s.calendar_date + (s.clock_time ? ' · ' + s.clock_time : '')) : '';
    var scene    = s.sceneName ? s.sceneName.replace(/_/g,' ') : '';
    var label    = [name, cls ? ('· ' + cls) : '', hp ? ('· ' + hp) : ''].filter(Boolean).join(' ');
    var sub      = [location, scene].filter(Boolean).join(' — ');
    return { label: label, sub: sub, saved: new Date().toLocaleString() };
  }

  // ── render ───────────────────────────────────────────────────────────────
  function render() {
    var list = document.getElementById('ampSlotList');
    if (!list) return;
    var html = '';
    for (var i = 1; i <= SLOTS; i++) {
      var meta = readMeta(i);
      var occupied = !!meta;
      html += '<div class="ampSlot">';
      html += '<span class="ampSlotNum">' + i + '</span>';
      if (occupied) {
        html += '<span class="ampSlotLabel"><b>' + esc(meta.label) + '</b><small>' +
                esc(meta.sub) + '</small><small style="color:#bbb">' + esc(meta.saved) + '</small></span>';
      } else {
        html += '<span class="ampSlotLabel empty">— Empty —</span>';
      }
      html += '<span class="ampSlotBtns">';
      html += '<button class="ampBtnSave" onclick="ampSaveLoad.save(' + i + ')" title="Save to slot ' + i + '">💾 Save</button>';
      if (occupied) {
        html += '<button class="ampBtnLoad" onclick="ampSaveLoad.load(' + i + ')" title="Load slot ' + i + '">📂 Load</button>';
        html += '<button class="ampBtnDel"  onclick="ampSaveLoad.del(' + i + ')"  title="Delete slot ' + i + '">🗑</button>';
      }
      html += '</span></div>';
    }
    list.innerHTML = html;
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── public API ───────────────────────────────────────────────────────────
  window.ampSaveLoad = {
    open: function() {
      render();
      document.getElementById('ampSLModal').showModal();
    },

    save: function(n) {
      // Need an active scene on the page to capture state.
      // computeCookie is a ChoiceScript global in util.js.
      var s = window.stats;
      if (!s || !s.sceneName) {
        toast('Nothing to save yet — start a new game first.');
        return;
      }
      // Grab the active scene's temps + position from pseudoSave[""].
      var raw = null;
      if (window._global && _global.pseudoSave) raw = _global.pseudoSave[''];
      if (!raw && typeof pseudoSave !== 'undefined') raw = pseudoSave[''];
      if (!raw) {
        toast('Could not capture game state. Try clicking a choice first.');
        return;
      }
      writeSlot(n, raw, buildMeta());
      render();
      toast('✔ Saved to Slot ' + n + '.');
    },

    load: function(n) {
      var slot = readSlot(n);
      if (!slot) { toast('Slot ' + n + ' is empty.'); return; }
      if (!confirm('Load Slot ' + n + '? Unsaved progress will be lost.')) return;
      document.getElementById('ampSLModal').close();
      // Parse the cookie string and hand it back to ChoiceScript.
      var state;
      try { state = JSON.parse(slot.cookie); } catch(e) { toast('Save data corrupted.'); return; }
      clearScreen(function() { restoreGame(state, null, true); });
    },

    del: function(n) {
      if (!confirm('Delete Slot ' + n + '?')) return;
      deleteSlot(n);
      render();
      toast('Slot ' + n + ' deleted.');
    },

    exportAll: function() {
      var out = {};
      for (var i = 1; i <= SLOTS; i++) {
        var s = readSlot(i);
        var m = readMeta(i);
        if (s) out['slot_' + i] = { save: s, meta: m };
      }
      if (!Object.keys(out).length) { toast('No saves to export.'); return; }
      var blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'amp_mercenary_saves_' + Date.now() + '.json';
      a.click();
      toast('Saves exported.');
    },

    importPrompt: function() {
      document.getElementById('ampImportFile').click();
    },

    importFile: function(evt) {
      var file = evt.target.files[0];
      if (!file) return;
      evt.target.value = '';
      var reader = new FileReader();
      reader.onload = function(e) {
        var data;
        try { data = JSON.parse(e.target.result); } catch(err) { toast('Invalid save file.'); return; }
        var count = 0;
        for (var key in data) {
          var m = key.match(/^slot_(\d+)$/);
          if (!m) continue;
          var n = parseInt(m[1], 10);
          if (n < 1 || n > SLOTS) continue;
          var entry = data[key];
          if (entry && entry.save && entry.meta) {
            localStorage.setItem(slotKey(n), JSON.stringify(entry.save));
            localStorage.setItem(metaKey(n), JSON.stringify(entry.meta));
            count++;
          }
        }
        render();
        toast('Imported ' + count + ' save(s).');
      };
      reader.readAsText(file);
    }
  };

  // Close modal if user clicks the backdrop
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('ampSLModal');
    if (modal) modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.close();
    });
  });
})();
</script>

<!-- ═══════════════════════════════════════════════════════════
     KOKORO READ-ALOUD SYSTEM
     Reads narrative paragraphs aloud via the Mempalace/Kokoro TTS
     server, with paragraph highlighting and look-ahead buffering
     so playback never stalls waiting on the next line.
     Hooks into ChoiceScript globals: printParagraph, clearScreen

<dialog id="ttsSettingsModal">
  <header>

  <div class="ttsBody">

    <input type="text" id="ttsServerUrl" placeholder="https://xxxx.ngrok-free.app">

    <label for="ttsKokoroVoice">Kokoro voice (preferred)</label>
    <select id="ttsKokoroVoice">
      <option value="">Auto (server default)</option>
      <option value="af_bella">af_bella (US Female)</option>
      <option value="af_sarah">af_sarah (US Female)</option>
      <option value="af_nicole">af_nicole (US Female)</option>

      <option value="am_adam">am_adam (US Male)</option>

    <label for="ttsEdgeVoice">Edge TTS fallback voice</label>
    <select id="ttsEdgeVoice">
      <option value="en-US-AriaNeural">en-US-AriaNeural (Female)</option>
      <option value="en-US-GuyNeural">en-US-GuyNeural (Male)</option>

      <label for="ttsAutoAdvance">Keep reading automatically after each choice</label>
    </div>

      <input type="checkbox" id="ttsFastStart">
      <label for="ttsFastStart">Fast start: use Edge TTS for a page's opening line, then Kokoro</label>
    </div>

<div id="ttsPanel">
  <button id="ttsPlayPause" title="Play/Pause">&#9658;</button>
  <button id="ttsStop" title="Stop">&#9632;</button>
  <span id="ttsStatus">Ready</span>
  <button id="ttsGear" title="Settings">&#9881;</button>
</div>
<button id="ttsLauncher" title="Read this story aloud">🔊</button>

<script>
(function () {
  var LOOKAHEAD = 2; // server caps concurrent Kokoro generation at 2 anyway
  var PARAGRAPH_PAUSE_MS = 400; // brief breath between paragraphs so lines don't run together
  var STORAGE_KEY = 'tts_reader_settings_v1';

  var savedSettings = {};
  try { savedSettings = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}
  var settings = {
    serverUrl: savedSettings.serverUrl || '',
    kokoroVoice: savedSettings.kokoroVoice || '',
    edgeVoice: savedSettings.edgeVoice || 'en-US-AriaNeural',
    speed: savedSettings.speed || 1.0,
    autoAdvance: !!savedSettings.autoAdvance,
    fastStart: savedSettings.fastStart !== false // default on
  };

  var state = {
    paragraphs: [],   // [{ el, text, hash }]
    index: -1,
    playing: false,
    enabled: false,
    cache: new Map(), // idx -> { status, promise, url }
    inflight: new Set(), // AbortControllers for requests currently on the wire
    sessionId: 0,
    listenMode: false,
    autoResumeNextPage: false,
    audio: new Audio()
  };

  function hashText(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return 'p' + (h >>> 0).toString(36);
  }

  function fetchTTS(text, hash, forceEdge, signal) {
    if (!settings.serverUrl) return Promise.reject(new Error('No server URL set — click ⚙ to configure.'));
    var base = settings.serverUrl.replace(/\/+$/, '');
    return fetch(base + '/tts', {
      method: 'POST',
      signal: signal,
      headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
      body: JSON.stringify({
        text: text,
        text_hash: hash,
        character_name: 'Narrator',
        message_id: hash,
        voice: settings.edgeVoice,
        kokoro_voice: settings.kokoroVoice || null,
        speed: settings.speed,
        force_edge: !!forceEdge
      })
    }).then(function (res) {
      if (!res.ok) throw new Error('Server responded ' + res.status);
      return res.blob();
    }).then(function (blob) {
      return URL.createObjectURL(blob);
    });
  }

  // Kokoro is CPU-bound: two jobs at once each run slower, so the chunk needed
  // NEXT arrives later than if it had the CPU to itself (measured on this
  // machine: 11.4s alone vs 16.1s alongside another job). So Kokoro requests
  // go out one at a time, nearest upcoming chunk first. Edge requests skip the
  // queue - they cost no local CPU. Queued requests from a page the player has
  // already left are dropped before they're ever sent.
  var kokoroQueue = [];
  var kokoroBusy = false;

  function pumpKokoro() {
    if (kokoroBusy) return;
    kokoroQueue = kokoroQueue.filter(function (job) {
      if (job.session === state.sessionId) return true;
      job.resolve(null);
      return false;
    });
    if (!kokoroQueue.length) return;
    var best = 0, bestScore = Infinity;
    kokoroQueue.forEach(function (job, i) {
      var d = job.idx - state.index;
      var score = d >= 0 ? d : 10000 - d; // chunks ahead of the playhead first, nearest first
      if (score < bestScore) { best = i; bestScore = score; }
    });
    var next = kokoroQueue.splice(best, 1)[0];
    kokoroBusy = true;
    next.run().then(next.resolve, next.reject).then(function () {
      kokoroBusy = false;
      pumpKokoro();
    });
  }

  function scheduleKokoro(idx, session, run) {
    return new Promise(function (resolve, reject) {
      kokoroQueue.push({ idx: idx, session: session, run: run, resolve: resolve, reject: reject });
      pumpKokoro();
    });
  }

  function ensureFetched(idx) {
    if (idx < 0 || idx >= state.paragraphs.length) return;
    if (state.cache.has(idx)) return;
    var entry = { status: 'pending', url: null };
    state.cache.set(idx, entry);
    var mySession = state.sessionId;
    var p = state.paragraphs[idx];
    var controller = new AbortController();
    var send = function () {
      state.inflight.add(controller);
      return fetchTTS(p.text, p.hash, p.forceEdge, controller.signal).then(function (url) {
        state.inflight.delete(controller);
        return url;
      }, function (e) {
        state.inflight.delete(controller);
        throw e;
      });
    };
    var request = p.forceEdge ? send() : scheduleKokoro(idx, mySession, send);
    entry.promise = request.then(function (url) {
      if (mySession !== state.sessionId) { if (url) URL.revokeObjectURL(url); return null; }
      entry.status = 'ready';
      entry.url = url;
      return url;
    }).catch(function (e) {
      if (mySession !== state.sessionId) return null; // cancelled by a page turn / Stop - not an error
      console.warn('[TTS Reader] failed for paragraph', idx, e);
      entry.status = 'error';
      setStatus('TTS error: ' + e.message);
      return null;
    });
  }

  function prefetchWindow(idx) {
    for (var i = idx; i <= idx + LOOKAHEAD; i++) ensureFetched(i);
  }

  function highlight(idx) {
    clearHighlight();
    var p = state.paragraphs[idx];
    if (!p) return;
    p.el.classList.add('ttsHighlight');
    var rect = p.el.getBoundingClientRect();
    var inView = rect.top >= 60 && rect.bottom <= window.innerHeight - 60;
    if (!inView) p.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function clearHighlight() {
    state.paragraphs.forEach(function (p) { p.el.classList.remove('ttsHighlight'); });
  }

  function playFrom(idx) {
    var mySession = state.sessionId;
    if (idx >= state.paragraphs.length) {
      state.playing = false;
      state.index = idx;
      updatePanel();
      setStatus('Waiting for more story…');
      return;
    }
    state.index = idx;
    state.playing = true;
    updatePanel();
    highlight(idx);
    prefetchWindow(idx);
    setStatus('Loading ' + (idx + 1) + '/' + state.paragraphs.length + '…');

    var entry = state.cache.get(idx);
    entry.promise.then(function (url) {
      if (mySession !== state.sessionId) return;
      if (!url) { playFrom(idx + 1); return; }
      setStatus('Reading ' + (idx + 1) + '/' + state.paragraphs.length);
      state.audio.src = url;
      state.audio.play().catch(function (e) { console.warn('[TTS Reader] play() failed', e); });
    });
  }

  state.audio.addEventListener('ended', function () {
    if (!state.playing) return;
    var mySession = state.sessionId;
    setTimeout(function () {
      if (mySession !== state.sessionId || !state.playing) return;
      playFrom(state.index + 1);
    }, PARAGRAPH_PAUSE_MS);
  });
  state.audio.addEventListener('error', function () {
    if (!state.playing) return;
    setStatus('Playback error, skipping…');
    playFrom(state.index + 1);
  });

  function play() {
    state.listenMode = true; // standing intent to keep listening across page turns
    if (state.paragraphs.length === 0) { setStatus('No story text yet.'); return; }
    if (state.index === -1 || state.index >= state.paragraphs.length) {
      playFrom(0);
    } else if (state.audio.src) {
      state.playing = true;
      state.audio.play();
      updatePanel();
      setStatus('Reading ' + (state.index + 1) + '/' + state.paragraphs.length);
    } else {
      playFrom(state.index);
    }
  }

  function pause() {
    state.listenMode = false; // explicit pause cancels auto-resume on the next page
    state.playing = false;
    state.audio.pause();
    updatePanel();
    setStatus('Paused.');
  }

  function stop() {
    state.listenMode = false;
    state.sessionId++;
    state.playing = false;
    state.audio.pause();
    state.audio.removeAttribute('src');
    clearHighlight();
    state.cache.forEach(function (e) { if (e.url) URL.revokeObjectURL(e.url); });
    state.cache.clear();
    // Cancel requests still on the wire so the next page's first Kokoro job
    // isn't stuck behind a stale one, then drop this session's queued jobs.
    // (sessionId was bumped above, so the aborts read as cancellations.)
    state.inflight.forEach(function (c) { c.abort(); });
    state.inflight.clear();
    pumpKokoro();
    state.index = -1;
    updatePanel();
  }

  function jumpTo(idx) {
    state.audio.pause();
    state.audio.removeAttribute('src');
    playFrom(idx);
  }

  // --- hook into the ChoiceScript engine ---
  var _origPrintParagraph = window.printParagraph;
  window.printParagraph = function (msg, parent) {
    var p = _origPrintParagraph(msg, parent);
    if (p && state.enabled) onParagraphAdded(p);
    return p;
  };

  var _origClearScreen = window.clearScreen;
  window.clearScreen = function (code) {
    onScreenClear();
    return _origClearScreen(code);
  };

  function onScreenClear() {
    if (!state.enabled) return;
    var shouldResume = state.listenMode && settings.autoAdvance;
    stop();
    state.listenMode = shouldResume; // stop() clears this; restore it if we're auto-continuing
    state.paragraphs = [];
    state.autoResumeNextPage = shouldResume;
    setStatus(shouldResume ? 'Waiting for next page…' : 'Ready');
  }

  // Splits off just the first sentence of a fresh page's opening paragraph
  // so the reader has something short to synthesize and start playing
  // immediately, instead of waiting on the whole (often multi-sentence)
  // paragraph before any audio can begin. Only applied to the page
  // opener - every choice in this game re-triggers this cold-start cost,
  // unlike RoyalRoad where it's a one-time-per-chapter delay.
  function splitOpeningSentence(text) {
    var m = text.match(/^(.{1,300}?[.!?])(\s+)([\s\S]*)$/);
    if (!m) return [text];
    var rest = (m[3] || '').trim();
    if (!rest) return [text];
    return [m[1], rest];
  }

  function pushParagraphChunk(el, text, forceEdge) {
    var idx = state.paragraphs.length;
    state.paragraphs.push({ el: el, text: text, hash: hashText(text), forceEdge: !!forceEdge });
    return idx;
  }

  // HUD/status lines (location headers, clock & HP bars, combat toasts, loot
  // popups) aren't narrative prose and sound like garbage read aloud. They
  // have a consistent structural signature in this game's scenes: either a
  // "◈ TITLE" section header, or an entire line wrapped in a single pair
  // of literal square brackets (e.g. "[⏳ Hour: 10:30 | Hit Points: 7/7]").
  function isHudLine(text) {
    if (text.charAt(0) === '◈') return true; // section/location header
    if (text.charAt(0) === '[' && text.charAt(text.length - 1) === ']') return true; // status/combat toast
    return false;
  }

  // A paragraph can mix HUD chrome with real prose: ChoiceScript merges
  // consecutive script lines (e.g. a "◈ TITLE" header, a *line_break, then the
  // opening prose) into ONE <p>. HUD lines are always bold, so strip just
  // those <b> pieces and keep the narrative that remains.
  function getNarrativeText(pEl) {
    var clone = pEl.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('b'), function (b) {
      if (isHudLine(b.textContent.trim())) b.parentNode.removeChild(b);
    });
    Array.prototype.forEach.call(clone.querySelectorAll('br'), function (br) {
      br.parentNode.replaceChild(document.createTextNode(' '), br);
    });
    return clone.textContent.replace(/\s+/g, ' ').trim();
  }

  function onParagraphAdded(pEl) {
    var text = getNarrativeText(pEl);
    if (!text || isHudLine(text)) return;

    var isPageOpener = state.paragraphs.length === 0;
    var chunks = isPageOpener ? splitOpeningSentence(text) : [text];

    var firstIdx = -1;
    chunks.forEach(function (chunkText, chunkIdx) {
      // Only the very first chunk of a fresh page's opener goes to Edge - it's
      // the one thing blocking any audio at all, and Edge has no CPU cost or
      // concurrency cap. Everything else (including the rest of this same
      // paragraph) still uses Kokoro.
      var useEdge = settings.fastStart && isPageOpener && chunkIdx === 0;
      var idx = pushParagraphChunk(pEl, chunkText, useEdge);
      if (firstIdx === -1) firstIdx = idx;
    });

    pEl.style.cursor = 'pointer';
    pEl.title = 'Click to read from here';
    pEl.addEventListener('click', function () { jumpTo(firstIdx); });

    if (isPageOpener && state.autoResumeNextPage) {
      state.autoResumeNextPage = false;
      playFrom(0);
    } else if (state.playing) {
      prefetchWindow(state.index);
    }
  }

  // --- UI wiring ---
  var panel = document.getElementById('ttsPanel');
  var launcher = document.getElementById('ttsLauncher');

  function updatePanel() {
    document.getElementById('ttsPlayPause').innerHTML = state.playing ? '&#10074;&#10074;' : '&#9658;';
  }
  function setStatus(text) {
    var el = document.getElementById('ttsStatus');
    if (el) el.textContent = text;
  }

  launcher.addEventListener('click', function () {
    state.enabled = true;
    launcher.style.display = 'none';
    panel.style.display = 'flex';
    if (state.paragraphs.length === 0) {
      Array.prototype.forEach.call(document.querySelectorAll('#text > p'), function (pEl) {
        if (pEl.innerText.trim()) onParagraphAdded(pEl);
      });
    }
    play();
  });
  document.getElementById('ttsPlayPause').addEventListener('click', function () {
    if (state.playing) pause(); else play();
  });
  document.getElementById('ttsStop').addEventListener('click', stop);
  document.getElementById('ttsGear').addEventListener('click', function () {
    document.getElementById('ttsServerUrl').value = settings.serverUrl;
    document.getElementById('ttsKokoroVoice').value = settings.kokoroVoice;
    document.getElementById('ttsEdgeVoice').value = settings.edgeVoice;
    document.getElementById('ttsSpeed').value = settings.speed;
    document.getElementById('ttsSpeedLabel').textContent = Number(settings.speed).toFixed(2) + 'x';
    document.getElementById('ttsAutoAdvance').checked = settings.autoAdvance;
    document.getElementById('ttsFastStart').checked = settings.fastStart;
    document.getElementById('ttsSettingsModal').showModal();
  });
  document.getElementById('ttsSpeed').addEventListener('input', function (e) {
    document.getElementById('ttsSpeedLabel').textContent = Number(e.target.value).toFixed(2) + 'x';
  });

  window.TTSReader = {
    saveSettings: function () {
      settings.serverUrl = document.getElementById('ttsServerUrl').value.trim();
      settings.kokoroVoice = document.getElementById('ttsKokoroVoice').value;
      settings.edgeVoice = document.getElementById('ttsEdgeVoice').value;
      settings.speed = parseFloat(document.getElementById('ttsSpeed').value);
      settings.autoAdvance = document.getElementById('ttsAutoAdvance').checked;
      settings.fastStart = document.getElementById('ttsFastStart').checked;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
      document.getElementById('ttsSettingsModal').close();
    }
  };
})();
</script>

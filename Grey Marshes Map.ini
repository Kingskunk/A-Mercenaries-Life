                       BAY OF VALEN & ESTUARY (Coastal Sea Routes)
==================================================================================================

Glyph	Meaning	Tactical Implication
[CAPITAL]	Sovereign Stronghold / Citadel	Heavily garrisoned; high walls; administrative center; massive supply stores.
[Town]	Walled Market or Industrial Hub	Has specialized guild/craft facilities (smelters, granaries, cloth halls, docks).
[Village]	Rural Farming/Mining Settlement	Unfortified; produces raw resources (food, fleeces, ore); highly vulnerable to raids.
[Choke Point]	Fort, Gatehouse, or Bastion	Blocks transit entirely unless held, bypassed via perilous terrain, or bribed.
▲▲▲	High Granite Mountains	Impassable to wagons; sheer rock faces, freezing winds, loose shale scree.
∩∩∩	Rolling Chalk Downs	Open visibility; excellent for cavalry and archers; rapid cross-country movement.
♠♠♠	Deep Ancient Forest	Obscured line of sight; blocks heavy supply trains; ideal for ambushes and partisans.
░░░	Peat Bogs, Meres, & Silt	Knee-to-waist-deep mud; causes drowning/exhaustion; wagon wheels sink immediately.
≈≈≈	Sea Water / Estuary	Navigable by deep-draft coastal vessels; subject to tidal currents and coastal storms.
════	Paved Imperial Stone Road	25–30 miles/day; stone culverts prevent mudding; wagon-friendly.
────	Packed-Loam Dirt / Drove Road	15–20 miles/day in dry weather; drops to 8–10 miles/day when sodden.
····	Corduroy Logs / Mountain Track	Single-file pack mules only; impassable to siege engines and carts.
║ ║	The Navigable Grey River	Downriver barge speed: 30 miles in 8–10 hours; upriver poling: 3–4 days.